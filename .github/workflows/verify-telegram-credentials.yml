name: Verify Telegram credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate this repository's bot token and owner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          token = os.environ.get("BOT_TOKEN", "").strip()
          owner = os.environ.get("OWNER_ID", "").strip()
          expected = os.environ.get("BOT_USERNAME", "").strip().lstrip("@")
          if not token:
              sys.exit("Missing repository secret: BOT_TOKEN")
          if not owner.isdigit() or int(owner) <= 0:
              sys.exit("Missing or invalid repository secret: OWNER_ID (numeric Telegram user ID)")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/getMe",
              headers={"User-Agent": "GitHub-Actions-Telegram-Credential-Check"}
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.loads(response.read().decode("utf-8"))
          except Exception:
              sys.exit("Telegram getMe request failed; BOT_TOKEN may be invalid or network access failed.")
          if not data.get("ok"):
              sys.exit("Telegram rejected BOT_TOKEN.")
          bot = data.get("result", {})
          actual = bot.get("username", "")
          if expected and actual.lower() != expected.lower():
              sys.exit(f"BOT_USERNAME mismatch: token belongs to @{actual}, expected @{expected}.")
          print(f"PASS: token is valid for @{actual} (bot ID {bot.get('id')}).")
          print(f"PASS: OWNER_ID is configured as numeric ID {owner}.")
          PY
